<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>ADSI Memory Visualizer — Cognitive Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  html, body {
    margin: 0; padding: 0; height: 100%; width: 100%;
    background: radial-gradient(circle at center, #000015, #000);
    font-family: "Segoe UI", sans-serif;
    overflow: hidden;
    color: #00ffff;
  }
  #info {
    position: absolute;
    top: 20px; left: 50%;
    transform: translateX(-50%);
    text-align: center;
    font-size: 20px;
    text-shadow: 0 0 10px #00ffff80;
  }
  #energyBar {
    position: absolute;
    bottom: 60px; left: 50%;
    transform: translateX(-50%);
    width: 80%; height: 20px;
    border: 1px solid #00ffff;
    border-radius: 10px;
    overflow: hidden;
    background: #001a1a;
  }
  #energyLevel {
    height: 100%; width: 0%;
    background: linear-gradient(90deg,#00ffff,#0088ff);
    transition: width 1s ease;
  }
  #mood {
    font-size: 26px;
    margin-top: 8px;
    color: #ffb300;
    text-shadow: 0 0 15px #ffaa0080;
  }
  canvas {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
  }
</style>
</head>
<body>
<div id="info">
  <div>🧠 <b>ADSI MEMORY VISUALIZER</b></div>
  <div id="mood">Cargando memoria...</div>
</div>
<div id="energyBar"><div id="energyLevel"></div></div>
<canvas id="memoryCanvas"></canvas>

<script type="module">
// --- VARIABLES PRINCIPALES ---
import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.157/build/three.module.js";
import { OrbitControls } from "https://cdn.jsdelivr.net/npm/three@0.157/examples/jsm/controls/OrbitControls.js";

let scene, camera, renderer, particles;
let data = { average: 0, sessions: [] };
const energyLevel = document.getElementById("energyLevel");
const moodLabel = document.getElementById("mood");

// --- CARGA DE MEMORIA ---
async function loadMemory() {
  try {
    const res = await fetch("audio-memory.json");
    data = await res.json();
    updateDashboard();
  } catch {
    moodLabel.textContent = "Sin memoria registrada aún.";
  }
}
function updateDashboard() {
  const avg = data.average || 0;
  const mood = inferMood(avg);
  moodLabel.textContent = "Estado actual: " + mood.toUpperCase();
  energyLevel.style.width = (avg * 100) + "%";
}
function inferMood(avg) {
  if (avg < 0.3) return "calma";
  if (avg < 0.6) return "flujo";
  return "expansión";
}

// --- ESCENA 3D ---
scene = new THREE.Scene();
camera = new THREE.PerspectiveCamera(75, innerWidth/innerHeight, 0.1, 1000);
camera.position.z = 10;

renderer = new THREE.WebGLRenderer({ canvas: document.getElementById("memoryCanvas"), antialias:true });
renderer.setSize(innerWidth, innerHeight);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;

// --- PARTICLES ---
const geometry = new THREE.BufferGeometry();
const particleCount = 600;
const positions = new Float32Array(particleCount * 3);

for (let i = 0; i < particleCount * 3; i++) {
  positions[i] = (Math.random() - 0.5) * 20;
}
geometry.setAttribute("position", new THREE.BufferAttribute(positions, 3));

const material = new THREE.PointsMaterial({ color: 0x00ffff, size: 0.08, transparent: true });
particles = new THREE.Points(geometry, material);
scene.add(particles);

// --- ANIMACIÓN ---
let t = 0;
function animate() {
  requestAnimationFrame(animate);
  t += 0.01;

  const mood = inferMood(data.average || 0);
  const colorMap = { calma: 0x00ffaa, flujo: 0x0099ff, expansión: 0xff6600 };
  material.color.setHex(colorMap[mood] || 0x00ffff);

  particles.rotation.x += 0.001 + (data.average/50);
  particles.rotation.y += 0.002 + (data.average/50);

  const pos = particles.geometry.attributes.position.array;
  for (let i = 0; i < pos.length; i+=3) {
    pos[i+1] += Math.sin(t + i/100) * 0.002;
  }
  particles.geometry.attributes.position.needsUpdate = true;

  controls.update();
  renderer.render(scene, camera);
}

// --- REFRESCO DE DATOS ---
setInterval(loadMemory, 4000);
animate();
loadMemory();
</script>
</body>
</html>
