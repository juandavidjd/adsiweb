<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>ADSI NeuroDisplay Interface — Cognitive Core</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  html,body{
    margin:0; padding:0; height:100%; width:100%;
    background:radial-gradient(circle at center,#000010,#000);
    font-family:"Segoe UI",sans-serif;
    color:#00ffff;
    overflow:hidden;
  }
  #hud{
    position:absolute;
    top:10px; left:10px; right:10px;
    display:flex; justify-content:space-between; align-items:center;
    z-index:10;
  }
  #status{
    font-size:18px;
    text-shadow:0 0 10px #00ffff90;
  }
  #controls button{
    background:#001a1a; color:#00ffff;
    border:1px solid #00ffff;
    padding:8px 14px; margin-left:8px;
    border-radius:8px;
    cursor:pointer;
    font-size:14px;
  }
  #controls button:hover{
    background:#00ffff20;
  }
  #energyBar{
    position:absolute;
    bottom:40px; left:50%;
    transform:translateX(-50%);
    width:80%; height:12px;
    border:1px solid #00ffff;
    border-radius:10px;
    overflow:hidden;
  }
  #energyLevel{
    width:0%; height:100%;
    background:linear-gradient(90deg,#00ffaa,#0077ff);
    transition:width 1s ease;
  }
  canvas{
    position:absolute;
    top:0; left:0; width:100%; height:100%;
  }
</style>
</head>
<body>
<div id="hud">
  <div id="status">🧠 <b>ADSI NeuroDisplay Interface</b> — Sistema en modo cognitivo</div>
  <div id="controls">
    <button id="startAudio">🎙️ Iniciar Audio</button>
    <button id="stopAudio">⏹️ Detener</button>
    <button id="speak">🗣️ Respuesta ADSI</button>
  </div>
</div>

<div id="energyBar"><div id="energyLevel"></div></div>
<canvas id="canvas"></canvas>

<script type="module">
import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.157/build/three.module.js";
import { OrbitControls } from "https://cdn.jsdelivr.net/npm/three@0.157/examples/jsm/controls/OrbitControls.js";

let scene,camera,renderer,particles,energyAvg=0;

// Inicializar escena
scene=new THREE.Scene();
camera=new THREE.PerspectiveCamera(75,innerWidth/innerHeight,0.1,1000);
camera.position.z=10;
renderer=new THREE.WebGLRenderer({canvas:document.getElementById("canvas"),antialias:true});
renderer.setSize(innerWidth,innerHeight);
const controls=new OrbitControls(camera,renderer.domElement);
controls.enableDamping=true;

// Partículas
const geom=new THREE.BufferGeometry();
const count=800; const pos=new Float32Array(count*3);
for(let i=0;i<pos.length;i++) pos[i]=(Math.random()-0.5)*20;
geom.setAttribute("position",new THREE.BufferAttribute(pos,3));
const mat=new THREE.PointsMaterial({color:0x00ffff,size:0.08,transparent:true});
particles=new THREE.Points(geom,mat);
scene.add(particles);

// Animación
function animate(){
  requestAnimationFrame(animate);
  controls.update();
  particles.rotation.x+=0.001+energyAvg/200;
  particles.rotation.y+=0.002+energyAvg/200;
  renderer.render(scene,camera);
}
animate();

// Sincronización con memoria
async function updateMemory(){
  try{
    const res=await fetch("audio-memory.json");
    const d=await res.json();
    energyAvg=d.average||0;
    const bar=document.getElementById("energyLevel");
    bar.style.width=(energyAvg*100)+"%";
    const color=energyAvg<0.3?"#00ffaa":energyAvg<0.6?"#0099ff":"#ff6600";
    bar.style.background=`linear-gradient(90deg,${color},#000)`;
    document.body.style.background=energyAvg<0.3
      ?"radial-gradient(circle,#001a1a,#000)"
      :energyAvg<0.6
      ?"radial-gradient(circle,#001133,#000)"
      :"radial-gradient(circle,#330000,#000)";
  }catch{}
}
setInterval(updateMemory,3000);

// Respuesta de voz adaptativa
function speak(text){
  const utter=new SpeechSynthesisUtterance(text);
  utter.voice=speechSynthesis.getVoices().find(v=>v.lang.startsWith("es"));
  utter.rate=energyAvg<0.3?0.8:energyAvg<0.6?1:1.3;
  utter.pitch=energyAvg<0.3?0.8:energyAvg<0.6?1:1.4;
  speechSynthesis.speak(utter);
}

// Control de audio local
let audioContext,micStream,analyser;
async function startAudio(){
  audioContext=new (window.AudioContext||window.webkitAudioContext)();
  micStream=await navigator.mediaDevices.getUserMedia({audio:true});
  const src=audioContext.createMediaStreamSource(micStream);
  analyser=audioContext.createAnalyser();
  src.connect(analyser);
  const data=new Uint8Array(analyser.frequencyBinCount);
  const loop=()=>{analyser.getByteFrequencyData(data);
    const avg=data.reduce((a,b)=>a+b)/data.length/255;
    energyAvg=avg; requestAnimationFrame(loop);}
  loop();
}
function stopAudio(){if(micStream) micStream.getTracks().forEach(t=>t.stop());}

// Botones
document.getElementById("startAudio").onclick=startAudio;
document.getElementById("stopAudio").onclick=stopAudio;
document.getElementById("speak").onclick=()=>speak("Sistema ADSI activo. Energía cognitiva sincronizada.");
</script>
</body>
</html>
